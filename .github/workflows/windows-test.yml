name: windows-test

# Windows 产品检查：PR 与 main 都在真实 x64 Windows 上跑全量单测和安装冒烟。
# 两个 job 都硬失败；是否阻止合并仍由仓库 required-check 规则决定。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: 安装 ffmpeg（直接下载静态构建，带重试，不依赖任何目录 API）
        shell: pwsh
        run: |
          $url = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          $ok = $false
          foreach ($i in 1..3) {
            try { Invoke-WebRequest $url -OutFile ff.zip -TimeoutSec 120; $ok = $true; break }
            catch { Start-Sleep -Seconds (10 * $i) }
          }
          if (-not $ok) { throw 'ffmpeg download failed after retries' }
          Expand-Archive ff.zip -DestinationPath $env:RUNNER_TEMP\ff
          $bin = Get-ChildItem -Directory $env:RUNNER_TEMP\ff | Select-Object -First 1
          Add-Content $env:GITHUB_PATH (Join-Path $bin.FullName 'bin')
      - name: 安装依赖
        run: bun install --frozen-lockfile
      - name: 全量单测
        # Several suites exercise native Windows watchers and process lifecycle.
        # Keep the native watcher in its own fresh Bun process below.
        env:
          CHENGFENG_VIDEOCUT_SKIP_NATIVE_WATCHER_TEST: "1"
        run: bun test --max-concurrency=1 packages apps/cli/src apps/studio/src/server/videocutEditListApi.test.ts
      - name: 原生项目 watcher（独立硬门禁）
        run: bun test apps/cli/src/server/project-watcher.test.ts

  # W1 验收：真实 Windows 上装得上、跑得出版本号。这个 job 是硬门禁。
  install-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装依赖
        run: bun install --frozen-lockfile
      - name: 构建便携包
        run: |
          bun run package:build
          bun scripts/package-portable.ts
      - name: 组装本地 release 夹具并安装
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force local-release | Out-Null
          Copy-Item release/chengfeng-videocut-portable.tar.gz local-release/
          Copy-Item install.cjs local-release/
          node -e "const{createHash}=require('crypto');const fs=require('fs');const p='local-release/chengfeng-videocut-portable.tar.gz';const h=createHash('sha256').update(fs.readFileSync(p)).digest('hex');fs.writeFileSync('local-release/SHA256SUMS.txt',h+'  chengfeng-videocut-portable.tar.gz\n');"
          $env:CHENGFENG_VIDEOCUT_HOME = Join-Path $env:RUNNER_TEMP 'vc-home'
          $env:CHENGFENG_VIDEOCUT_DOWNLOAD_BASE = ([uri](Join-Path $PWD 'local-release')).AbsoluteUri
          $originalPath = $env:PATH
          $nativeBun = (Get-Command bun.exe -ErrorAction Stop).Source
          $brokenShimBin = Join-Path $env:RUNNER_TEMP '01-pnpm-bin'
          $nativeBin = Join-Path $env:RUNNER_TEMP '02-native-bin'
          New-Item -ItemType Directory -Force $brokenShimBin, $nativeBin | Out-Null
          [IO.File]::WriteAllText(
            (Join-Path $brokenShimBin 'bun.cmd'),
            "@echo off`r`nexit /b 91`r`n",
            [Text.Encoding]::ASCII
          )
          Copy-Item $nativeBun (Join-Path $nativeBin 'bun.exe')
          $env:PATH = "$brokenShimBin;$nativeBin;$originalPath"
          node local-release/install.cjs
          $installExit = $LASTEXITCODE
          $env:PATH = $originalPath
          if ($installExit -ne 0) { exit $installExit }
          $version = & (Join-Path $env:CHENGFENG_VIDEOCUT_HOME 'bin\chengfeng-videocut.cmd') --version
          Write-Host "launcher reports: $version"
          if ($version -notmatch '\d+\.\d+\.\d+') { exit 1 }
