name: windows-test

# Windows 产品检查：PR 与 main 都在真实 x64 Windows 上跑全量单测和安装冒烟。
# 两个 job 都硬失败；是否阻止合并仍由仓库 required-check 规则决定。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # The Product contract is the self-contained installer. The legacy portable
  # archive cannot prove a managed Bun/FFmpeg installation and is not a user path.
  install-smoke:
    uses: ./.github/workflows/native-windows-installer-smoke.yml

  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: 准备固定版本的 FFmpeg 6.0 测试工具
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $toolBin = Join-Path $env:RUNNER_TEMP "chengfeng-videocut-test-tools"
          New-Item -ItemType Directory -Force $toolBin | Out-Null

          function Get-PinnedFixture([string] $Url, [string] $Destination, [string] $Sha256) {
            foreach ($attempt in 1..3) {
              try {
                Invoke-WebRequest -Uri $Url -OutFile $Destination -TimeoutSec 180
                break
              } catch {
                if ($attempt -eq 3) { throw }
                Start-Sleep -Seconds (10 * $attempt)
              }
            }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $Destination).Hash.ToLowerInvariant()
            if ($actual -ne $Sha256) { throw "Pinned test tool SHA256 mismatch: $Destination ($actual)" }
          }

          # Local CI fixture only; this does not change the formal UNVERIFIED
          # redistribution gate in installer/managed-tools.lock.json.
          $ffmpeg = Join-Path $toolBin "ffmpeg.exe"
          $ffprobe = Join-Path $toolBin "ffprobe.exe"
          Get-PinnedFixture "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-win32-x64" $ffmpeg "e9fd5e711debab9d680955fc1e38a2c1160fd280b144476cc3f62bc43ef49db1"
          Get-PinnedFixture "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffprobe-win32-x64" $ffprobe "139f8420bcb2f29fcd5734e29d686289df826cadce5d2b7b5f56d0000ea9a951"
          if ((& $ffmpeg -version | Select-Object -First 1) -notmatch "^ffmpeg version (?:n)?6\.0(?:[-\s]|$)") {
            throw "FFmpeg fixture is not 6.0"
          }
          if ((& $ffprobe -version | Select-Object -First 1) -notmatch "^ffprobe version (?:n)?6\.0(?:[-\s]|$)") {
            throw "FFprobe fixture is not 6.0"
          }
          Add-Content $env:GITHUB_PATH $toolBin
      - name: 安装依赖
        run: bun install --frozen-lockfile
      - name: 全量单测
        # Several suites exercise native Windows watchers and process lifecycle.
        # Keep the native watcher in its own fresh Bun process below.
        timeout-minutes: 20
        env:
          CHENGFENG_VIDEOCUT_SKIP_NATIVE_WATCHER_TEST: "1"
        run: bun test --max-concurrency=1 packages apps/cli/src apps/studio/src/server/videocutEditListApi.test.ts
      - name: 原生项目 watcher（独立硬门禁）
        timeout-minutes: 5
        run: bun test apps/cli/src/server/project-watcher.test.ts
