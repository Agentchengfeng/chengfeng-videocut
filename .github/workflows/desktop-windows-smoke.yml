name: desktop-windows-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/desktop-windows-smoke.yml"
      - "apps/desktop/**"
      - "apps/cli/**"
      - "apps/studio/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"

jobs:
  packaged-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run desktop:test
      - run: bun run desktop:dist:win
      - run: bun run --cwd apps/desktop smoke:packaged
      - name: Install NSIS package without elevation
        shell: pwsh
        run: |
          $installer = Get-ChildItem "apps/desktop/release/Chengfeng-VideoCut-*-win-x64.exe" |
            Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer artifact was not produced"
          }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Windows installer exited with $($install.ExitCode)"
          }
          $installedApp = Join-Path $env:LOCALAPPDATA `
            "Programs/Chengfeng VideoCut/Chengfeng VideoCut.exe"
          if (-not (Test-Path $installedApp)) {
            throw "Installed desktop executable was not found at $installedApp"
          }
          "CHENGFENG_VIDEOCUT_PACKAGED_APP=$installedApp" >> $env:GITHUB_ENV
      - name: Smoke-test installed application
        run: bun run --cwd apps/desktop smoke:packaged
      - name: Uninstall test application
        if: always()
        shell: pwsh
        run: |
          $uninstaller = Join-Path $env:LOCALAPPDATA `
            "Programs/Chengfeng VideoCut/Uninstall Chengfeng VideoCut.exe"
          if (Test-Path $uninstaller) {
            $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) {
              throw "Windows uninstaller exited with $($uninstall.ExitCode)"
            }
          }
