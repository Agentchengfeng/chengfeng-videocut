name: desktop-windows-smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/desktop-windows-smoke.yml"
      - "apps/desktop/**"
      - "apps/cli/**"
      - "apps/studio/**"
      - "packages/**"
      - "install.cjs"
      - "scripts/package-portable.ts"
      - "scripts/release-assets.ts"
      - "scripts/write-release-checksums.ts"
      - "scripts/release-artifact-check.ts"
      - "scripts/stage-desktop-windows-release.ts"
      - "apps/cli/scripts/pack-package.ts"
      - "package.json"
      - "bun.lock"

jobs:
  packaged-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build desktop runtime after dependencies are linked
        run: bun run desktop:prepare
      - run: bun run release:check
      - run: bun run desktop:test
      - run: bun run desktop:dist:win
      - run: bun run --cwd apps/desktop smoke:packaged
      - run: bun run --cwd apps/desktop smoke:managed-packaged
      - name: Install NSIS package without elevation
        shell: pwsh
        run: |
          $installer = Get-ChildItem "apps/desktop/release/Chengfeng-VideoCut-*-win-x64.exe" |
            Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer artifact was not produced"
          }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Windows installer exited with $($install.ExitCode)"
          }
          $programsDir = Join-Path $env:LOCALAPPDATA "Programs"
          $installedApps = @(
            Get-ChildItem $programsDir `
              -Filter "Chengfeng VideoCut.exe" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue
          )
          if ($installedApps.Count -ne 1) {
            $found = ($installedApps | ForEach-Object FullName) -join ", "
            throw "Expected exactly one installed desktop executable under $programsDir; found $($installedApps.Count): $found"
          }
          $installedApp = $installedApps[0].FullName
          $installedDir = $installedApps[0].DirectoryName
          "CHENGFENG_VIDEOCUT_PACKAGED_APP=$installedApp" >> $env:GITHUB_ENV
          "CHENGFENG_VIDEOCUT_INSTALLED_DIR=$installedDir" >> $env:GITHUB_ENV
      - name: Smoke-test installed application
        run: |
          bun run --cwd apps/desktop smoke:packaged
          bun run --cwd apps/desktop smoke:managed-packaged
      - name: Uninstall test application
        if: ${{ always() && env.CHENGFENG_VIDEOCUT_INSTALLED_DIR != '' }}
        shell: pwsh
        run: |
          if (-not $env:CHENGFENG_VIDEOCUT_INSTALLED_DIR) {
            throw "Installed application directory was not recorded"
          }
          $uninstallers = @(
            Get-ChildItem $env:CHENGFENG_VIDEOCUT_INSTALLED_DIR `
              -Filter "Uninstall*.exe" `
              -File `
              -ErrorAction SilentlyContinue
          )
          if ($uninstallers.Count -ne 1) {
            $found = ($uninstallers | ForEach-Object FullName) -join ", "
            throw "Expected exactly one uninstaller; found $($uninstallers.Count): $found"
          }
          $uninstall = Start-Process `
            -FilePath $uninstallers[0].FullName `
            -ArgumentList "/S" `
            -Wait `
            -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Windows uninstaller exited with $($uninstall.ExitCode)"
          }
          foreach ($attempt in 1..20) {
            if (-not (Test-Path $env:CHENGFENG_VIDEOCUT_PACKAGED_APP)) {
              exit 0
            }
            Start-Sleep -Milliseconds 500
          }
          throw "Installed desktop executable still exists after uninstall"
      - name: Assemble checksummed prerelease assets after Windows smoke
        run: |
          bun run package:pack
          bun run release:stage:windows-desktop
          bun run release:checksums
          bun run release:artifact-check
      - name: Fresh-install the final Release portable Runtime
        shell: pwsh
        run: |
          $releaseHome = Join-Path $env:RUNNER_TEMP 'chengfeng-videocut-final-release-home'
          Remove-Item -Recurse -Force $releaseHome -ErrorAction SilentlyContinue
          $env:CHENGFENG_VIDEOCUT_HOME = $releaseHome
          $env:CHENGFENG_VIDEOCUT_DOWNLOAD_BASE = ([uri](Join-Path $PWD 'release')).AbsoluteUri
          node release/install.cjs
          if ($LASTEXITCODE -ne 0) { throw "Final release install.cjs exited with $LASTEXITCODE" }
          $launcher = Join-Path $releaseHome 'bin\chengfeng-videocut.cmd'
          $actualVersion = (& $launcher --version).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Installed stable launcher exited with $LASTEXITCODE" }
          if ($actualVersion -ne '0.4.8') {
            throw "Expected final-release launcher version 0.4.8; got $actualVersion"
          }
      - name: Preserve checksummed Windows prerelease assets
        uses: actions/upload-artifact@v4
        with:
          name: chengfeng-videocut-windows-prerelease-assets
          path: |
            release/install.sh
            release/install.cjs
            release/chengfeng-videocut-*-portable.tar.gz
            release/chengfeng-videocut-portable.tar.gz
            release/chengfeng-videocut-*.tgz
            release/chengfeng-videocut.tgz
            release/Chengfeng-VideoCut-*-win-x64.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
