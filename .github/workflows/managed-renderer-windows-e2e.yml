name: managed-renderer-windows-e2e

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-e2e:
    name: Headless Shell -> subtitle MP4
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      # This is test-host infrastructure, not a Product Runtime dependency.
      # The source-preview test deliberately starts from an empty Product cache
      # and obtains only the pinned Headless Shell itself.
      - name: Install FFmpeg and FFprobe for the test host
        shell: pwsh
        run: |
          $url = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-release-essentials.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          $ok = $false
          foreach ($attempt in 1..3) {
            try {
              Invoke-WebRequest $url -OutFile $archive -TimeoutSec 120
              $ok = $true
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          if (-not $ok) { throw 'FFmpeg download failed after retries' }
          Expand-Archive $archive -DestinationPath $destination
          $root = Get-ChildItem -Path $destination -Directory | Select-Object -First 1
          if (-not $root) { throw 'FFmpeg archive did not contain a root directory' }
          Add-Content $env:GITHUB_PATH (Join-Path $root.FullName 'bin')

      # Avoid the historical Electron workspace. This is the same developer
      # command advertised by the source preview, now on a real Windows x64 host.
      - name: Install renderer-test dependencies
        run: bun install --filter '@video-workbench/koubo-adapter' --ignore-scripts --frozen-lockfile

      - name: Render a real MP4 from an empty Product cache
        shell: pwsh
        run: |
          $env:CHENGFENG_VIDEOCUT_RENDERER_E2E = '1'
          bun test packages/koubo-adapter/src/export/exportFilm.managed-runtime.test.ts
