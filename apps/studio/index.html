<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>chengfeng-videocut</title>
    <style>
      :root {
        color-scheme: dark;
        background: #080808;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #080808;
      }
      #studio-boot-guard {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #080808;
        color: #f5f5f5;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #studio-boot-guard[hidden] {
        display: none !important;
      }
      .studio-boot-card {
        width: min(420px, 100%);
        padding: 28px;
        box-sizing: border-box;
        border: 1px solid #262626;
        border-radius: 16px;
        background: #111;
        box-shadow: 0 24px 80px rgb(0 0 0 / 45%);
        text-align: center;
      }
      .studio-boot-spinner {
        width: 24px;
        height: 24px;
        margin: 0 auto 18px;
        border: 2px solid #333;
        border-top-color: #34d399;
        border-radius: 999px;
        animation: studio-boot-spin 0.8s linear infinite;
      }
      #studio-boot-guard[data-state="error"] .studio-boot-spinner {
        animation: none;
        border-color: #ef4444;
      }
      #studio-boot-status {
        display: block;
        font-size: 16px;
        line-height: 1.4;
      }
      #studio-boot-detail {
        margin: 10px 0 0;
        color: #a3a3a3;
        font-size: 13px;
        line-height: 1.6;
      }
      #studio-boot-reload {
        margin-top: 20px;
        padding: 9px 16px;
        border: 0;
        border-radius: 8px;
        background: #34d399;
        color: #052e24;
        font: inherit;
        font-size: 13px;
        font-weight: 650;
        cursor: pointer;
      }
      @keyframes studio-boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="studio-boot-guard" data-state="loading" role="status" aria-live="polite">
      <div class="studio-boot-card">
        <div class="studio-boot-spinner" aria-hidden="true"></div>
        <strong id="studio-boot-status">正在打开 chengfeng-videocut</strong>
        <p id="studio-boot-detail">正在连接本地工作台并载入剪辑项目…</p>
        <button id="studio-boot-reload" type="button" hidden>重新打开</button>
      </div>
    </div>
    <div data-hf-id="hf-aph5" id="root"></div>
    <script src="/studio-boot-guard.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
